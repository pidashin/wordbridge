version: '3'
services:
  webapp:
    build:
      context: https://github.com/pidashin/wordbridge.git#main
      dockerfile: Dockerfile
    image: wordbridge
    container_name: wordbridge
    env_file:
      - .env.local
    environment:
      - WORDS_JSON_PATH=/app/data/words.json
      - WORDS_AI_JSON_PATH=/app/data/words_ai.json
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    ports:
      # Host port 3001, not 3000 — the NAS's portfolio container already
      # publishes 3000. Only affects direct host-level access; nginx reaches
      # this container over the internal `web` Docker network by container
      # name on its unchanged internal port (3000, Next.js's own default),
      # so no nginx config depends on this value.
      - '3001:3000'
    networks:
      - web
    command: sh -c "npx prisma db push && npm start"

networks:
  web:
    name: web
    external: true
